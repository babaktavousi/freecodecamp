[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "anchorcheck"
version = "0.1.0"
description = "Structural review of chemical anchors and post-installed dowels on drawings (AS 5216 / AS 3600)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["reportlab>=4.0", "pypdfium2>=4.0", "requests>=2.28", "streamlit>=1.30", "pandas>=1.5", "Pillow>=9.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
anchorcheck = "anchorcheck.cli:main"

[tool.setuptools.packages.find]
include = ["anchorcheck*"]

[tool.setuptools.package-data]
anchorcheck = ["report/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
